<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TalentYug</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js"></script>
</head>

<body>
  <div class="auth-box">
    <h2>Welcome to TalentYug</h2>

    <form onsubmit="event.preventDefault(); login();">
      <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <div class="divider"><span>Or continue with</span></div>

    <div class="social-login">
      <!-- Google Button -->
      <button type="button" class="social-btn" onclick="loginWithGoogle()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        Google
      </button>
    </div>

    <p>
      <a href="forgot.html">Forgot password?</a><br><br>
      New here? <a href="register.html">Create an account</a>
    </p>
  </div>
</body>

</html>

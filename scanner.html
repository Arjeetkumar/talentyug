<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner – TalentYug</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .material-icons-round {
            vertical-align: middle;
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        #reader video {
            object-fit: cover;
            border-radius: 16px;
        }
    </style>
</head>

<body class="dashboard-page">

    <!-- DASHBOARD NAVBAR -->
    <div class="dashboard-navbar">
        <div class="nav-left">
            <div class="nav-logo">
                <img src="logo.png" alt="TalentYug Logo">
                TalentYug
            </div>
            <div class="nav-links">
                <a href="Event.html">My Events</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="pre-registration.html">Pre-Registration</a>
                <a href="qr.html">QR Codes</a>
                <a href="scanner.html" class="active">Scanner</a>
                <a href="guestlist.html">Guest Lists</a>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="dashboard-container">

        <div class="page-header">
            <div>
                <h1>QR Scanner</h1>
                <div class="subtitle">Scan tickets or check-in guests instantly.</div>
            </div>
        </div>

        <div class="dashboard-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">

            <!-- SCANNER CARD -->
            <div class="d-card" style="text-align:center;">
                <div id="reader"></div>

                <div style="margin-top:24px;">
                    <p style="color:var(--muted); font-size:14px; margin-bottom:16px;">Point your camera at a QR code
                    </p>
                    <button id="startScanBtn" class="btn-save" onclick="startScanning()"
                        style="width:auto; padding:10px 24px;">
                        <span class="material-icons-round" style="margin-right:8px;">videocam</span> Start Camera
                    </button>
                    <button id="stopScanBtn" class="btn-cancel" onclick="stopScanning()"
                        style="width:auto; padding:10px 24px; display:none; color:var(--danger); border-color:var(--danger);">
                        Stop Camera
                    </button>
                </div>
            </div>

            <!-- RESULT CARD -->
            <div class="d-card">
                <h3 style="margin-bottom:20px; color:var(--text);">Scan Result</h3>

                <div id="scan-placeholder"
                    style="text-align:center; padding:40px; color:var(--muted); border:2px dashed var(--border); border-radius:12px;">
                    <span class="material-icons-round" style="font-size:48px; opacity:0.5;">qr_code_scanner</span>
                    <p style="margin-top:12px;">No code scanned yet.</p>
                </div>

                <div id="scan-result" style="display:none;">
                    <div
                        style="background:#def7ec; color:#03543f; padding:16px; border-radius:12px; margin-bottom:20px; display:flex; gap:12px; align-items:center;">
                        <span class="material-icons-round">check_circle</span>
                        <div>
                            <strong style="display:block; font-size:14px;">Scan Successful</strong>
                            <span style="font-size:12px;">Just now</span>
                        </div>
                    </div>

                    <label style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;">DATA
                        CONTENT</label>
                    <div id="result-text"
                        style="font-size:18px; font-weight:600; color:var(--text); margin-top:4px; margin-bottom:24px; word-break:break-all;">
                        https://talentyug.com
                    </div>

                    <div style="display:flex; gap:12px;">
                        <button class="btn-save" onclick="handleAction('approve')">Approve Entry</button>
                        <button class="btn-cancel" onclick="handleAction('reject')"
                            style="background:#fde8e8; color:#9b1c1c; border-color:#f8b4b4;">Reject</button>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        let html5QrcodeScanner;

        function startScanning() {
            document.getElementById('startScanBtn').style.display = 'none';
            document.getElementById('stopScanBtn').style.display = 'inline-flex';

            html5QrcodeScanner = new Html5Qrcode("reader");

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    // Success callback
                    onScanSuccess(decodedText);
                    stopScanning(); // auto stop after scan
                },
                (errorMessage) => {
                    // parse error, ignore usually
                }
            ).catch(err => {
                alert("Camera access failed: " + err);
                stopScanning();
            });
        }

        function stopScanning() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('startScanBtn').style.display = 'inline-flex';
                    document.getElementById('stopScanBtn').style.display = 'none';
                }).catch(err => console.log(err));
            }
        }

        function onScanSuccess(text) {
            document.getElementById('scan-placeholder').style.display = 'none';
            document.getElementById('scan-result').style.display = 'block';
            document.getElementById('result-text').innerText = text;

            // Play a beep sound if desired (not implemented here)
        }

        function handleAction(action) {
            if (action === 'approve') alert("Guest Approved!");
            else alert("Guest Rejected!");

            // Reset UI
            document.getElementById('scan-result').style.display = 'none';
            document.getElementById('scan-placeholder').style.display = 'block';

            // Optionally auto-restart
            // startScanning(); 
        }

        function logout() {
            window.location.href = "login.html";
        }

        function toggleTheme() {
            const current = Storage.getTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            Storage.setTheme(next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = document.querySelector('.theme-icon');
            if (icon) icon.innerText = theme === 'dark' ? 'light_mode' : 'dark_mode';
        }

        // Init Theme UI
        window.addEventListener('load', () => {
            updateThemeIcon(Storage.getTheme());
        });
    </script>
    <script src="storage.js"></script>
</body>

</html>
